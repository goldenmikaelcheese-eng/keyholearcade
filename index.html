<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GamesOne has moved!</title>
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff8ec;font-family:system-ui,sans-serif;color:#2a1a40;text-align:center;padding:20px;box-sizing:border-box}
 h1{color:#c2185b;margin:0 0 8px}a{display:inline-block;margin-top:14px;background:#ffd23f;color:#3a2a00;padding:12px 20px;border-radius:12px;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div>
 <h1>🎮 GamesOne has moved!</h1>
 <p>Taking you to the new link with all your progress…</p>
 <a id="go" href="https://gamesonearcade.github.io/">Go to GamesOne</a>
</div>
<script>
// Copies everything this browser saved for GamesOne on the old link and carries it to the new link.
(function(){var NEW="https://gamesonearcade.github.io/";var data={};
 try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);data[k]=localStorage.getItem(k)}}catch(e){}
 var url=NEW+location.search;
 try{if(Object.keys(data).length){var enc=btoa(unescape(encodeURIComponent(JSON.stringify(data))));if(enc.length<1800000)url+="#move="+enc}}catch(e){}
 document.getElementById("go").href=url;setTimeout(function(){location.replace(url)},600)})();
</script>
</body>
</html>
